# Host-plane WriteHERE driver layer.
# agent-drivers must exist before writehere registers the constructor.
# The root package name is the Web sidebar (dsh.client). Subpaths are host-only.
- insert:
    - id: agent-drivers
      name: dsh-agent-driver-writehere/agent-drivers

    - id: writehere
      name: dsh-agent-driver-writehere/writehere
      inject: [agentDrivers]

    - id: ui-article-tree
      name: dsh-agent-driver-writehere
